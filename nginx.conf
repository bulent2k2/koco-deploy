# Tek origin: HF Spaces yalnızca bir port açıyor. nginx 7860'ı dinler ve
# istekleri iki JVM servisine dağıtır. Her şey aynı origin'den geldiği için
# tarayıcı->router çağrılarında CORS'a hiç gerek kalmaz (router'ın corsOrigins
# ayarı env ile değiştirilemiyor, bu yüzden bu önemli).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  # derleme yanıtları büyük (1MB+ JS) ve derleme yavaş olabilir
  client_max_body_size 64m;
  proxy_read_timeout   300s;
  proxy_send_timeout   300s;

  # geçici dosyalar: HF konteyneri salt-okunur olabilir, /tmp'e yaz
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  # WebSocket upgrade için gerekli
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream editor { server 127.0.0.1:9000; }
  upstream router { server 127.0.0.1:8880; }

  server {
    listen 7860;
    server_name _;

    # --- router (derleyici ön yüzü) ---
    # Bu yollar kojojs-core/router/.../WebService.scala'da tanımlı ve
    # kojojs-editor'ün routes dosyasıyla çakışmıyor.
    location = /compile        { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    location = /complete       { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    location = /embed          { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    location = /codeframe      { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    location = /compileResult  { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    location ^~ /cache/        { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }

    # --- editör (Play) : geri kalan her şey ---
    location / { proxy_pass http://editor; include /etc/nginx/proxy_common.conf; }
  }
}
