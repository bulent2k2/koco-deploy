# Tek origin: HF Spaces yalnızca bir port açıyor. nginx 7860'ı dinler ve
# istekleri iki JVM servisine dağıtır. Her şey aynı origin'den geldiği için
# tarayıcı->router çağrılarında CORS'a hiç gerek kalmaz (router'ın corsOrigins
# ayarı env ile değiştirilemiyor, bu yüzden bu önemli). İstisna: betiği
# çalıştıran sonuç çerçevesi OPAK kökende (kojojs-editor#45), ona göre aynı
# sunucu da çapraz köken -- /media/ ve /assets/ bu yüzden CORS başlığıyla
# sunuluyor (aşağıda).
worker_processes 1;
# 'stderr' anahtar kelimesi miras alınan fd'yi kullanır; '/dev/stderr' ise
# yeniden AÇMAYA çalışır ve ayrıcalık düşürüldükten sonra izin alamaz.
error_log stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  # derleme yanıtları büyük (1MB+ JS) ve derleme yavaş olabilir
  client_max_body_size 64m;
  proxy_read_timeout   300s;
  proxy_send_timeout   300s;

  # geçici dosyalar: HF konteyneri salt-okunur olabilir, /tmp'e yaz
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  # WebSocket upgrade için gerekli
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream editor { server 127.0.0.1:9000; }
  upstream router { server 127.0.0.1:8880; }

  server {
    listen 7860;
    server_name _;

    # --- router (derleyici ön yüzü) ---
    # Bu yollar kojojs-core/router/.../WebService.scala'da tanımlı ve
    # kojojs-editor'ün routes dosyasıyla çakışmıyor.
    location = /compile        { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    location = /complete       { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    location = /embed          { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }
    # /codeframe gelen iletideki kodu eval ediyor ve aynı kökende duruyor
    # (kojojs-editor#45). CSP `sandbox` onu kim açarsa açsın (window.open ile
    # üst düzeyde bile) opak kökende tutuyor; kod koco'nun kökeninde koşmuyor.
    # frame-ancestors BİLEREK YOK: CSP her ata çerçeveye bakıyor ve /embed
    # başka sitelere gömülüyor -- 'self' gömülü fiddle'ları kırardı. /embed
    # codeframe'i zaten sandbox="allow-scripts" ile çerçeveliyor, orada bu
    # başlık bir şeyi değiştirmiyor. İzinler editörün /resultframe'iyle aynı
    # (kojojs-editor Application.resultFrame): CSP sandbox yalnız kısıtlıyor,
    # embed iframe'i ileride genişletilirse başlık onu sessizce kısmasın.
    # allow-popups-to-escape-sandbox YOK, açılan pencere de opak kalıyor.
    location = /codeframe {
      proxy_pass http://router; include /etc/nginx/proxy_common.conf;
      add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-modals" always;
    }
    location = /compileResult  { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }

    # /resultframe (editörün sonuç çerçevesi) de gelen kodu eval ediyor. Editör
    # kendi CSP sandbox başlığını Play'de koyuyor (kojojs-editor#45,
    # Application.resultFrame); aynısı burada da, derinlemesine savunma olarak
    # ve editör dağıtımını beklemeden: başlık olmadan başka bir site bu sayfayı
    # sandbox'sız çerçeveleyip kodunu editörün kökeninde koşturabiliyordu
    # (ölçüldü). İki CSP başlığı birlikte uygulanıyor (kesişim), çakışmıyor.
    # frame-ancestors BİLEREK YOK (/codeframe'deki gerekçe, HF Spaces).
    location = /resultframe {
      proxy_pass http://editor; include /etc/nginx/proxy_common.conf;
      add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-modals" always;
    }
    location ^~ /cache/        { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }

    # /bilgi -- sunucunun hangi ağaçtan kurulduğu (kojojs-core#35). Dışarıya
    # açık olan TEK tanı ucu.
    #
    # `=` TAM EŞLEŞME, ve bu bilerek: `location /bilgi` (öneksiz) olsaydı
    # /bilgi/tam da dışarı çıkardı -- orada iç kimlikler ve derleyici sayısı
    # var. Tam hâl ayrıca anahtar da istiyor, yani iki katman; ama buradaki
    # `=` işareti o ikinci katmana YÜK BİNDİRMEMEK için duruyor.
    #
    # Gövdesi yalnız açık depoların commit'leri + imaj kimliği. /durum ve
    # /saglik listede YOK ve olmayacak (karar kaydı: koco-deploy#17).
    location = /bilgi          { proxy_pass http://router; include /etc/nginx/proxy_common.conf; }

    # --- medya (ses/görüntü): masaüstü Koco'nun /media/... yolları ---
    # Betikler Ses.vuruş = "/media/collidium/hit.mp3" gibi sabitler kullanır;
    # dosyalar kojojs-dev/medya'dan imaja /app/medya olarak girer (build.sh).
    #
    # CORS başlığı ŞART (kojojs-editor#45): betiği çalıştıran sonuç çerçevesi
    # opak kökende (sandbox'ta allow-same-origin yok), yani aynı sunucudaki
    # /media/ bile ona ÇAPRAZ köken. PIXI resmi crossOrigin=anonymous ile
    # istiyor, Howler sesi XHR ile; başlık yoksa ikisi de "blocked by CORS
    # policy" ile düşüyor (Chromium'da ölçüldü, PIXI 5.3.12). Dosyalar açık,
    # kimlik bilgisi taşımıyor -- "*" yeterli ve güvenli. Aynı sebeple
    # /assets/ de (aşağıda).
    location ^~ /media/ {
      alias /app/medya/;
      expires 7d; # Cache-Control: max-age=604800
      add_header Access-Control-Allow-Origin "*" always;
    }

    # --- editörün durağan dosyaları, CORS başlığıyla ---
    # Kaplumbağanın varsayılan simgesi (kojojs-dev Turtle, "assets/images/
    # turtle32.png") opak kökenli sonuç çerçevesinden PIXI ile crossOrigin=
    # anonymous isteniyor; başlık olmadan CORS'a takılıp simge görünmüyordu
    # (kojojs-editor#45). /assets/ altındaki her şey zaten açık.
    # DİKKAT: ACAO yalnız burada verilmeli. Play'in CORS filtresi bugün yalnız
    # /raw ve /oembed'i kapsıyor (kojojs-editor application.conf
    # play.filters.cors.pathPrefixes); oraya /assets eklenirse yanıt İKİ ACAO
    # değeri taşır ve tarayıcı CORS'u reddeder (koco-deploy#50 incelemesi).
    location ^~ /assets/ {
      proxy_pass http://editor; include /etc/nginx/proxy_common.conf;
      add_header Access-Control-Allow-Origin "*" always;
    }

    # --- editör (Play) : geri kalan her şey ---
    location / { proxy_pass http://editor; include /etc/nginx/proxy_common.conf; }
  }
}
